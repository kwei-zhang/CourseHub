services:

  user-server:
    build:
      context: .
      dockerfile: user-server/Dockerfile
    ports:
      - "5001:5001"
    environment:
      DATABASE_URL: ${DATABASE_URL}
    restart: unless-stopped


  file-server:
    build:
      context: .
      dockerfile: file-server/Dockerfile
    ports:
      - "5002:5002"
    environment:
      DATABASE_URL: ${FILE_SERVER_DATABASE_URL}
      SPACES_BUCKET: ${SPACES_BUCKET}
      SPACES_KEY: ${SPACES_KEY}
      SPACES_SECRET: ${SPACES_SECRET}
      SPACES_REGION: ${SPACES_REGION:-tor1}
      SPACES_ENDPOINT: ${SPACES_ENDPOINT:-https://tor1.digitaloceanspaces.com}
    restart: unless-stopped

  system-server:
    build:
      context: .
      dockerfile: system-server/Dockerfile
    ports:
      - "5003:5003"
    restart: unless-stopped

  auth:
    build:
      context: .
      dockerfile: auth/Dockerfile
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PROTO_PATH: /app/proto/services.proto
      USER_SERVER: user-server:5001
      FILE_SERVER: file-server:5002
      SYSTEM_SERVER: system-server:5003
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-replace-me-with-32-char-secret-min}
      BETTER_AUTH_URL: http://localhost:4000
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      user-server:
        condition: service_started
      file-server:
        condition: service_started
      system-server:
        condition: service_started
    restart: unless-stopped
