name: CI

on:
  push:
    branches:
      - main
      - prod
  pull_request:

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate docker-compose.local.yml
        run: docker compose -f docker-compose.local.yml config

      - name: Build auth image
        run: docker build -f auth/Dockerfile -t auth-test .

      - name: Build user-server image
        run: docker build -f user-server/Dockerfile -t user-server-test .

      - name: Build file-server image
        run: docker build -f file-server/Dockerfile -t file-server-test .

      - name: Build system-server image
        run: docker build -f system-server/Dockerfile -t system-server-test .

      - name: Build frontend image
        run: docker build --build-arg NEXT_PUBLIC_AUTH_URL=http://localhost:4000 -f frontend/Dockerfile -t frontend-test .

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-validate
    if: github.ref == 'refs/heads/prod' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DO Container Registry
        run: doctl registry login --expiry-seconds 1200

      - name: Build and push auth
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            -t registry.digitalocean.com/ece1779lrms/auth:latest \
            -f auth/Dockerfile \
            --push .

      - name: Build and push user-server
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            -t registry.digitalocean.com/ece1779lrms/user-server:latest \
            -f user-server/Dockerfile \
            --push .

      - name: Build and push file-server
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            -t registry.digitalocean.com/ece1779lrms/file-server:latest \
            -f file-server/Dockerfile \
            --push .

      - name: Build and push system-server
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            -t registry.digitalocean.com/ece1779lrms/system-server:latest \
            -f system-server/Dockerfile \
            --push .

      - name: Build and push frontend
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --build-arg NEXT_PUBLIC_AUTH_URL=https://chalatus.com \
            -t registry.digitalocean.com/ece1779lrms/frontend:latest \
            -f frontend/Dockerfile \
            --push .

      - name: Save kubeconfig
        run: doctl kubernetes cluster kubeconfig save lrms-cluster

      - name: Roll out new images
        run: |
          kubectl rollout restart deployment/auth -n lrms
          kubectl rollout restart deployment/user-server -n lrms
          kubectl rollout restart deployment/file-server -n lrms
          kubectl rollout restart deployment/system-server -n lrms
          kubectl rollout restart deployment/frontend -n lrms

      - name: Wait for rollouts to complete
        run: |
          kubectl rollout status deployment/auth -n lrms --timeout=180s
          kubectl rollout status deployment/user-server -n lrms --timeout=180s
          kubectl rollout status deployment/file-server -n lrms --timeout=180s
          kubectl rollout status deployment/system-server -n lrms --timeout=180s
          kubectl rollout status deployment/frontend -n lrms --timeout=180s
