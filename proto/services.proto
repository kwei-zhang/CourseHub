syntax = "proto3";

package ece1779;

// ---------------------------------------------------------------------------
// Shared/Common
// ---------------------------------------------------------------------------
message GetRequest {}

message GetResponse {
  string message = 1;
}

// ---------------------------------------------------------------------------
// UserService
// ---------------------------------------------------------------------------
service UserService {
  rpc Get(GetRequest) returns (GetResponse);
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc UpdateUser(UpdateUserRequest) returns (GetUserResponse);
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
  rpc SearchUsersByName(SearchUsersByNameRequest) returns (SearchUsersByNameResponse);
  rpc GetUserByEmail(GetUserByEmailRequest) returns (GetUserByEmailResponse);
  rpc CheckEnrollment(CheckEnrollmentRequest) returns (CheckEnrollmentResponse);
  rpc ListEnrollments(ListEnrollmentsRequest) returns (ListEnrollmentsResponse);
  rpc EnrollUser(EnrollUserRequest) returns (EnrollUserResponse);
  rpc UnenrollUser(UnenrollUserRequest) returns (UnenrollUserResponse);
  rpc ListCourses(ListCoursesRequest) returns (ListCoursesResponse);
  rpc CreateCourse(CreateCourseRequest) returns (CourseInfo);
  rpc DeleteCourse(DeleteCourseRequest) returns (DeleteCourseResponse);
  rpc ListAllUsers(ListAllUsersRequest) returns (ListAllUsersResponse);
}

message GetUserRequest {
  string user_id = 1;
}

message GetUserResponse {
  string id = 1;
  string name = 2;
  string email = 3;
  bool email_verified = 4;
  string image = 5;
  string created_at = 6;
  string updated_at = 7;
  string role = 8;
}

message UpdateUserRequest {
  string user_id = 1;
  optional string name = 2;
  optional string image = 3;
  optional string role = 4;
  optional bool email_verified = 5;
}

message DeleteUserRequest {
  string user_id = 1;
}

message DeleteUserResponse {
  bool ok = 1;
}

message SearchUsersByNameRequest {
  string name_query = 1;
}

message SearchUsersByNameResponse {
  repeated GetUserResponse users = 1;
}

message GetUserByEmailRequest {
  string email = 1;
}

message GetUserByEmailResponse {
  GetUserResponse user = 1;
}

message CheckEnrollmentRequest {
  string user_id = 1;
  string course_code = 2;
}

message CheckEnrollmentResponse {
  bool is_enrolled = 1;
  string role = 2;
}

message ListEnrollmentsRequest {
  string user_id = 1;
}

message CourseEnrollment {
  string course_id = 1;
  string course_code = 2;
  string course_name = 3;
  string role = 4;
}

message ListEnrollmentsResponse {
  repeated CourseEnrollment enrollments = 1;
}

message EnrollUserRequest {
  string user_id = 1;
  string course_code = 2;
  string role = 3;
}

message EnrollUserResponse {
  bool ok = 1;
  string enrollment_id = 2;
}

message UnenrollUserRequest {
  string user_id = 1;
  string course_code = 2;
}

message UnenrollUserResponse {
  bool ok = 1;
}

message CourseInfo {
  string id = 1;
  string code = 2;
  string name = 3;
}

message ListCoursesRequest {}

message ListCoursesResponse {
  repeated CourseInfo courses = 1;
}

message CreateCourseRequest {
  string code = 1;
  string name = 2;
  string instructor_id = 3;
}

message DeleteCourseRequest {
  string code = 1;
}

message DeleteCourseResponse {
  bool ok = 1;
}

message ListAllUsersRequest {}

message UserInfo {
  string id = 1;
  string name = 2;
  string email = 3;
  string role = 4;
}

message ListAllUsersResponse {
  repeated UserInfo users = 1;
}

// ---------------------------------------------------------------------------
// ResourceService
// ---------------------------------------------------------------------------
message Resource {
  string id = 1;
  string title = 2;
  string courseCode = 3;
  string contentType = 4;
  string objectKey = 5;
  string policy = 6;
  repeated string tags = 7;
  string uploaderId = 8;
}

message CreateResourceRequest {
  string title = 1;
  string courseCode = 2;
  string contentType = 3;
  string objectKey = 4;
  string policy = 5;
  repeated string tags = 6;
  string uploaderId = 7;
}

message GetResourceRequest { string id = 1; }
message ListResourcesRequest { string courseCode = 1; }
message ListResourcesResponse { repeated Resource resources = 1; }

message UpdateResourceRequest {
  string id = 1;
  optional string title = 2;
  optional string courseCode = 3;
  optional string contentType = 4;
  optional string objectKey = 5;
  optional string policy = 6;
  repeated string tags = 7;
  optional string uploaderId = 8;
}

message DeleteResourceRequest {
  string id = 1;
}

message DeleteResourceResponse {
  string id = 1;
  bool deleted = 2;
}

message RecordAccessLogRequest {
  string userId = 1;
  string resourceId = 2;
  AccessAction action = 3;
  string details = 4;   // optional (reason, policy, ip, etc.)
}

message RecordAccessLogResponse {
  string logId = 1;
  int64  timestampMs = 2;
}

enum AccessAction {
  UPLOAD_URL_ISSUED = 0;
  UPLOAD_URL_DENIED = 1;
  DOWNLOAD_URL_ISSUED = 2;
  DOWNLOAD_URL_DENIED = 3;
  METADATA_CREATED = 4;
  RESOURCE_DELETED = 5;
}

message ListAllResourcesRequest {}
message ListAllResourcesResponse { repeated Resource resources = 1; }

service ResourceService {
  rpc CreateResource(CreateResourceRequest) returns (Resource);
  rpc GetResource(GetResourceRequest) returns (Resource);
  rpc ListResources(ListResourcesRequest) returns (ListResourcesResponse);
  rpc ListAllResources(ListAllResourcesRequest) returns (ListAllResourcesResponse);
  rpc UpdateResource(UpdateResourceRequest) returns (Resource);
  rpc DeleteResource(DeleteResourceRequest) returns (DeleteResourceResponse);

  rpc RecordAccessLog(RecordAccessLogRequest) returns (RecordAccessLogResponse);
}

// ---------------------------------------------------------------------------
// FileService
// ---------------------------------------------------------------------------
message GetUploadUrlRequest {
  string title = 1;
  string courseCode = 2;
  string contentType = 3;
  string policy = 4;
  repeated string tags = 5;
  string uploaderId = 6;
  uint32 expires_in = 7;
}

message GetUploadUrlResponse {
  string url = 1;
  string object_key = 2;
}

message GetDownloadUrlRequest {
  string resource_id = 1;
  int32 expires_in = 2;
  string requester_user_id = 3;
}

message GetDownloadUrlResponse {
  string url = 1;
}

service FileService {
  rpc GetUploadUrl(GetUploadUrlRequest) returns (GetUploadUrlResponse);
  rpc GetDownloadUrl(GetDownloadUrlRequest) returns (GetDownloadUrlResponse);
}

// ---------------------------------------------------------------------------
// SystemService
// ---------------------------------------------------------------------------
service SystemService {
  rpc Get(GetRequest) returns (GetResponse);
  rpc RecordMetricEvent(RecordMetricEventRequest) returns (RecordMetricEventResponse);
  rpc GetMetricsOverview(GetMetricsOverviewRequest) returns (GetMetricsOverviewResponse);
  rpc GetMetricsTimeseries(GetMetricsTimeseriesRequest) returns (GetMetricsTimeseriesResponse);
  rpc ListIncidents(ListIncidentsRequest) returns (ListIncidentsResponse);
  rpc RecordBackupRun(RecordBackupRunRequest) returns (RecordBackupRunResponse);
  rpc GetBackupStatus(GetBackupStatusRequest) returns (GetBackupStatusResponse);
}

message RecordMetricEventRequest {
  string service_name = 1;
  string route_key = 2;
  int32 status_code = 3;
  int32 latency_ms = 4;
  int64 occurred_at_ms = 5;
}

message RecordMetricEventResponse {
  bool ok = 1;
}

message GetMetricsOverviewRequest {
  int32 window_minutes = 1;
}

message ServiceMetricSummary {
  string service_name = 1;
  int64 request_count = 2;
  int64 client_error_count = 3;
  int64 server_error_count = 4;
  int64 error_count = 5;
  double client_error_rate_pct = 6;
  double server_error_rate_pct = 7;
  double error_rate_pct = 8;
  double p95_latency_ms = 9;
}

message GetMetricsOverviewResponse {
  int32 window_minutes = 1;
  int64 request_count = 2;
  int64 client_error_count = 3;
  int64 server_error_count = 4;
  int64 error_count = 5;
  double client_error_rate_pct = 6;
  double server_error_rate_pct = 7;
  double error_rate_pct = 8;
  double p95_latency_ms = 9;
  repeated ServiceMetricSummary services = 10;
}

message GetMetricsTimeseriesRequest {
  string metric = 1;
  string service_name = 2;
  int32 window_minutes = 3;
  int32 step_minutes = 4;
}

message MetricsPoint {
  int64 ts_ms = 1;
  double value = 2;
}

message GetMetricsTimeseriesResponse {
  string metric = 1;
  string service_name = 2;
  int32 window_minutes = 3;
  int32 step_minutes = 4;
  repeated MetricsPoint points = 5;
}

message ListIncidentsRequest {
  int32 window_minutes = 1;
}

message Incident {
  string id = 1;
  string source = 2;
  string severity = 3;
  string status = 4;
  string title = 5;
  string message = 6;
  int64 started_at_ms = 7;
}

message ListIncidentsResponse {
  repeated Incident incidents = 1;
}

message RecordBackupRunRequest {
  string status = 1;
  int64 started_at_ms = 2;
  int64 finished_at_ms = 3;
  string object_key = 4;
  int64 size_bytes = 5;
  string error_message = 6;
}

message RecordBackupRunResponse {
  bool ok = 1;
}

message GetBackupStatusRequest {}

message GetBackupStatusResponse {
  bool has_backup = 1;
  string latest_status = 2;
  int64 last_started_at_ms = 3;
  int64 last_finished_at_ms = 4;
  int64 age_minutes = 5;
  int64 latest_size_bytes = 6;
  string latest_object_key = 7;
  string latest_error_message = 8;
}
