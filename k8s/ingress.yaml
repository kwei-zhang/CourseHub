apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lrms-ingress
  namespace: lrms
spec:
  ingressClassName: nginx
  rules:
    - host: lrms.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: auth
                port:
                  number: 4000
