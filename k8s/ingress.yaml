apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lrms-ingress
  namespace: lrms
  annotations:
    # Automatically provision a Let's Encrypt TLS certificate
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # Increase body size limit for file uploads
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - chalatus.com       # e.g. lrms.yourdomain.com
      secretName: lrms-tls
  rules:
    - host: chalatus.com      # e.g. lrms.yourdomain.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: auth
                port:
                  number: 4000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
