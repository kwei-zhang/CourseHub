apiVersion: apps/v1
kind: Deployment
metadata:
  name: system-server
  namespace: lrms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: system-server
  template:
    metadata:
      labels:
        app: system-server
    spec:
      containers:
        - name: system-server
          image: registry.digitalocean.com/ece1779-lrms/system-server:latest
          ports:
            - containerPort: 5003
