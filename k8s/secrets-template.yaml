apiVersion: v1
kind: Secret
metadata:
  name: lrms-secrets
  namespace: lrms
type: Opaque

stringData:
  # PostgreSQL password — must match what you set here and in the DATABASE_URLs below
  POSTGRES_PASSWORD: "REPLACE_WITH_POSTGRES_PASSWORD"

  # Both auth and user-server share this database (same host, same DB name)
  # e.g. postgresql://ece1779:YOUR_PASSWORD@postgres:5432/ece1779
  DATABASE_URL: "REPLACE_WITH_DATABASE_URL"

  # File-server uses a separate Postgres schema within the same database
  # e.g. postgresql://ece1779:YOUR_PASSWORD@postgres:5432/ece1779?schema=files
  FILE_SERVER_DATABASE_URL: "REPLACE_WITH_FILE_SERVER_DATABASE_URL"

  BETTER_AUTH_SECRET: "REPLACE_WITH_BETTER_AUTH_SECRET"

  # Public URL of the auth service — must match the path exposed by your ingress
  # e.g. https://yourdomain.com/api
  BETTER_AUTH_URL: "REPLACE_WITH_BETTER_AUTH_URL"

  # Public URL of the frontend — used by auth for CORS and OAuth redirect
  # e.g. https://yourdomain.com
  FRONTEND_URL: "REPLACE_WITH_FRONTEND_URL"

  GOOGLE_CLIENT_ID: "REPLACE_WITH_GOOGLE_CLIENT_ID"
  GOOGLE_CLIENT_SECRET: "REPLACE_WITH_GOOGLE_CLIENT_SECRET"

  SPACES_REGION: "tor1"
  SPACES_ENDPOINT: "https://tor1.digitaloceanspaces.com"
  SPACES_BUCKET: "REPLACE_WITH_SPACES_BUCKET"
  SPACES_KEY: "REPLACE_WITH_SPACES_KEY"
  SPACES_SECRET: "REPLACE_WITH_SPACES_SECRET"

  # HTTP URL of the DigitalOcean Function that sends announcement emails via Resend
  # Get this after deploying: doctl serverless functions get announcements/send --url
  DO_FUNCTION_URL: "REPLACE_WITH_DO_FUNCTION_URL"
