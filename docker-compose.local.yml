services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ece1779
      POSTGRES_PASSWORD: ece1779
      POSTGRES_DB: ece1779
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ece1779 -d ece1779"]
      interval: 2s
      timeout: 5s
      retries: 5

  user-server:
    build:
      context: .
      dockerfile: user-server/Dockerfile
    ports:
      - "5001:5001"
    environment:
      DATABASE_URL: postgresql://ece1779:ece1779@db:5432/ece1779
      SYSTEM_SERVER: system-server:5003
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  file-server:
    build:
      context: .
      dockerfile: file-server/Dockerfile
    ports:
      - "5002:5002"
    environment:
      DATABASE_URL: postgresql://ece1779:ece1779@db:5432/ece1779?schema=files
      SYSTEM_SERVER: system-server:5003
      SPACES_BUCKET: ${SPACES_BUCKET}
      SPACES_KEY: ${SPACES_KEY}
      SPACES_SECRET: ${SPACES_SECRET}
      SPACES_REGION: ${SPACES_REGION:-tor1}
      SPACES_ENDPOINT: ${SPACES_ENDPOINT:-https://tor1.digitaloceanspaces.com}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  system-server:
    build:
      context: .
      dockerfile: system-server/Dockerfile
    ports:
      - "5003:5003"
    environment:
      DATABASE_URL: postgresql://ece1779:ece1779@db:5432/ece1779
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health/ready').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  auth:
    build:
      context: .
      dockerfile: auth/Dockerfile
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://ece1779:ece1779@db:5432/ece1779
      PROTO_PATH: /app/proto/services.proto
      USER_SERVER: user-server:5001
      FILE_SERVER: file-server:5002
      RESOURCE_SERVER: file-server:5002
      SYSTEM_SERVER: system-server:5003
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-replace-me-with-32-char-secret-min}
      BETTER_AUTH_URL: http://localhost:4000
      FRONTEND_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
      user-server:
        condition: service_started
      file-server:
        condition: service_started
      system-server:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_AUTH_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      auth:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
